<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Document Workspace</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-block">
          <div class="brand-mark" aria-hidden="true">DW</div>
          <div class="brand-copy">
            <h1 id="bookTitle">Document Workspace</h1>
            <p id="bookMeta">Workspace ready</p>
          </div>
        </div>

        <label class="command-search">
          <svg class="icon search-icon" aria-hidden="true" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.3-4.3"></path>
          </svg>
          <input id="globalSearch" type="search" placeholder="Search documents..." autocomplete="off">
        </label>

        <div class="topbar-actions">
          <button id="themeToggle" class="theme-button" type="button" aria-label="Toggle theme" title="Toggle theme">
            <svg class="icon theme-sun" aria-hidden="true" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="4"></circle>
              <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
            </svg>
            <svg class="icon theme-moon" aria-hidden="true" viewBox="0 0 24 24">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"></path>
            </svg>
            <span id="themeLabel">Light</span>
          </button>
          <label class="file-button" aria-label="Import EPUB" title="Import EPUB">
            <svg class="icon" aria-hidden="true" viewBox="0 0 24 24">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <path d="m17 8-5-5-5 5M12 3v12"></path>
            </svg>
            <span>Import</span>
            <input id="fileInput" type="file" accept=".epub,application/epub+zip">
          </label>
        </div>
      </header>

      <main class="layout">
        <aside class="sidebar" aria-label="Thư viện chương">
          <div class="library-header">
            <div>
              <p class="eyebrow">Workspace</p>
              <h2>Documents</h2>
            </div>
            <span id="documentCount" class="count-badge">0</span>
          </div>

          <div class="chapter-picker">
            <label for="chapterSelect">Jump to</label>
            <select id="chapterSelect" disabled aria-label="Select document"></select>
          </div>

          <nav id="chapterList" class="chapter-list" aria-label="Danh sách chương"></nav>
        </aside>

        <section class="workspace-main">
          <header class="document-header">
            <div class="document-heading">
              <p class="eyebrow">Active document</p>
              <h2 id="documentTitle">No document selected</h2>
              <div class="metadata-row">
                <span id="chapterCounter">No collection</span>
                <span id="documentStatus" class="status-dot">Idle</span>
              </div>
            </div>

            <div class="reading-progress" aria-label="Tiến độ đọc">
              <div class="progress-copy">
                <span>Progress</span>
                <strong id="progressLabel">0%</strong>
              </div>
              <div class="progress-track" aria-hidden="true"><span id="progressBar"></span></div>
            </div>

            <div class="document-header-actions">
              <button id="prevChapter" class="nav-button" type="button" disabled aria-label="Previous document" title="Previous document">
                <svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"></path></svg>
              </button>
              <button id="nextChapter" class="nav-button" type="button" disabled aria-label="Next document" title="Next document">
                <svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"></path></svg>
              </button>
            </div>
          </header>

          <div class="document-toolbar" aria-label="Tùy chỉnh trình đọc">
            <div class="toolbar-group font-controls" aria-label="Cỡ chữ">
              <button id="fontDecrease" class="tool-button" type="button" aria-label="Giảm cỡ chữ" title="Giảm cỡ chữ">A−</button>
              <span id="fontSizeLabel">20px</span>
              <button id="fontIncrease" class="tool-button" type="button" aria-label="Tăng cỡ chữ" title="Tăng cỡ chữ">A＋</button>
            </div>

            <label class="toolbar-group width-control">
              <svg class="icon" aria-hidden="true" viewBox="0 0 24 24">
                <path d="M3 6h18M3 12h18M3 18h18"></path>
              </svg>
              <span>Width</span>
              <select id="widthPreset" aria-label="Độ rộng nội dung">
                <option value="comfortable">Standard</option>
                <option value="compact">Compact</option>
                <option value="wide">Wide</option>
              </select>
            </label>

            <div class="toolbar-spacer"></div>
            <button id="translateButton" class="primary-action" type="button" disabled>
              <svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="m5 3 14 9-14 9V3Z"></path></svg>
              Run Analysis
            </button>
            <button id="retranslateButton" class="secondary-action" type="button" hidden>
              <svg class="icon" aria-hidden="true" viewBox="0 0 24 24">
                <path d="M20 6v6h-6M4 18v-6h6"></path>
                <path d="M18.49 9A7 7 0 0 0 5.64 6.64L4 9M20 15l-1.64 2.36A7 7 0 0 1 5.51 15"></path>
              </svg>
              Refresh Output
            </button>
          </div>

          <div class="audio-toolbar" aria-label="Audio review controls">
            <div class="audio-heading">
              <svg class="icon" aria-hidden="true" viewBox="0 0 24 24">
                <path d="M4 14a8 8 0 0 1 16 0"></path>
                <path d="M18 19c0 1.1-.9 2-2 2h-1v-7h3a2 2 0 0 1 2 2v1a2 2 0 0 1-2 2ZM6 19a2 2 0 0 1-2-2v-1a2 2 0 0 1 2-2h3v7H8a2 2 0 0 1-2-2Z"></path>
              </svg>
              <div>
                <strong>Audio Review</strong>
                <small id="speechStatus">No output available</small>
              </div>
            </div>

            <label class="audio-field genre-field">
              <span>Genre</span>
              <select id="speechGenre" aria-label="Story genre">
                <option value="fantasy" selected>Huyền huyễn</option>
                <option value="horror">Linh dị / Kinh dị</option>
                <option value="apocalypse">Mạt thế</option>
                <option value="detective">Trinh thám</option>
                <option value="xianxia">Tiên hiệp</option>
              </select>
            </label>

            <label class="audio-field voice-field">
              <span>Voice</span>
              <select id="speechVoice" aria-label="Reading voice">
                <option value="Kore" selected>Kore · Clear</option>
                <option value="Aoede">Aoede · Warm</option>
                <option value="Leda">Leda · Bright</option>
                <option value="Puck">Puck · Expressive</option>
                <option value="Charon">Charon · Deep</option>
              </select>
            </label>

            <label class="audio-field rate-field">
              <span>Speed</span>
              <select id="speechRate" aria-label="Reading speed">
                <option value="0.8">0.8x</option>
                <option value="1" selected>1.0x</option>
                <option value="1.2">1.2x</option>
                <option value="1.5">1.5x</option>
              </select>
            </label>

            <div class="audio-actions">
              <button id="speechPlay" class="audio-play" type="button" disabled aria-label="Listen to output" title="Listen to output">
                <svg class="icon speech-play-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="m5 3 14 9-14 9V3Z"></path></svg>
                <svg class="icon speech-pause-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"></path></svg>
                <span id="speechPlayLabel">Listen</span>
              </button>
              <button id="speechStop" class="audio-stop" type="button" disabled aria-label="Stop audio" title="Stop audio">
                <svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1"></rect></svg>
              </button>
            </div>
          </div>

          <div id="sourceText" hidden></div>

          <section class="document-canvas">
            <article class="document-paper translation-section">
              <div class="paper-header">
                <div>
                  <p class="eyebrow">Document output</p>
                  <h3 id="paperTitle">Output Preview</h3>
                </div>
                <span class="status-pill" id="outputStatus">Pending</span>
              </div>
              <div id="translationText" class="document-text empty">No output available.</div>
            </article>
          </section>

          <footer class="footer-nav">
            <button id="bottomPrevChapter" class="text-nav" type="button" disabled>
              <svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"></path></svg>
              Previous document
            </button>
            <span id="bottomChapterCounter">No collection</span>
            <button id="bottomNextChapter" class="text-nav" type="button" disabled>
              Next document
              <svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"></path></svg>
            </button>
          </footer>
        </section>
      </main>
    </div>

    <script src="/vendor/jszip.min.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
