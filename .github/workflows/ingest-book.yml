name: Ingest uploaded book

# Dispatched by the admin panel after a presigned upload lands in the private
# archive bucket. Ingest takes minutes for a large EPUB, which is why it runs
# here rather than in a serverless function.
on:
  workflow_dispatch:
    inputs:
      archive_key:
        description: "Key của EPUB trong bucket archive (uploads/....epub)"
        required: true
      title:
        description: "Tên truyện"
        required: false
      author:
        required: false
      genre:
        required: false
      cover_key:
        required: false
      translate:
        description: "Xếp hàng dịch ngay sau khi ingest"
        required: false
        default: "true"

concurrency:
  # Serialised against itself so two uploads cannot publish conflicting
  # catalogue snapshots, but independent of the crawler and translate workers.
  group: ingest-book
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ARCHIVE_BUCKET: ${{ secrets.R2_ARCHIVE_BUCKET }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Check required secrets are present
        run: node scripts/check-env.js crawler

      - name: Ingest
        run: |
          node scripts/ingest-worker.js \
            --archive "$ARCHIVE_KEY" \
            --title "$BOOK_TITLE" \
            --author "$BOOK_AUTHOR" \
            --genre "$BOOK_GENRE" \
            --cover "$BOOK_COVER"
        env:
          # Passed as env rather than interpolated into the run script, so a
          # title containing shell metacharacters cannot become a command.
          ARCHIVE_KEY: ${{ inputs.archive_key }}
          BOOK_TITLE: ${{ inputs.title }}
          BOOK_AUTHOR: ${{ inputs.author }}
          BOOK_GENRE: ${{ inputs.genre }}
          BOOK_COVER: ${{ inputs.cover_key }}

      - name: Queue translation
        if: inputs.translate == 'true'
        run: node scripts/translate-worker.js --budget 40 --minutes 20
