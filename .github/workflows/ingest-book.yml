name: Ingest uploaded book

# Dispatched by the admin panel after a resumable upload lands in the private
# Google Drive archive folder. Ingest takes minutes for a large EPUB, which is why it runs
# here rather than in a serverless function.
on:
  workflow_dispatch:
    inputs:
      archive_key:
        description: "Key của EPUB trong Google Drive (uploads/....epub)"
        required: true
      title:
        description: "Tên truyện"
        required: false
      author:
        required: false
      genre:
        required: false
      cover_key:
        required: false
      translate:
        description: "Xếp hàng dịch ngay sau khi ingest"
        required: false
        default: "true"

concurrency:
  # Shared with crawler and translator: all three update the same Drive job/index
  # objects, which cannot be merged atomically across processes.
  group: novel-pipeline-storage-writes
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      STORAGE_DRIVER: drive
      GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
      GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
      GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
      GOOGLE_DRIVE_STORAGE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_STORAGE_FOLDER_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
      GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
      GROQ_FALLBACK_MODELS: ${{ secrets.GROQ_FALLBACK_MODELS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Check required secrets are present
        run: node scripts/check-env.js crawler

      - name: Ingest
        run: |
          node scripts/ingest-worker.js \
            --archive "$ARCHIVE_KEY" \
            --title "$BOOK_TITLE" \
            --author "$BOOK_AUTHOR" \
            --genre "$BOOK_GENRE" \
            --cover "$BOOK_COVER"
        env:
          # Passed as env rather than interpolated into the run script, so a
          # title containing shell metacharacters cannot become a command.
          ARCHIVE_KEY: ${{ inputs.archive_key }}
          BOOK_TITLE: ${{ inputs.title }}
          BOOK_AUTHOR: ${{ inputs.author }}
          BOOK_GENRE: ${{ inputs.genre }}
          BOOK_COVER: ${{ inputs.cover_key }}

      # Translation is intentionally not started in this workflow. The dedicated
      # translate-worker workflow owns the only translation concurrency group and
      # will pick this queue up on its next scheduled run. Starting a second
      # worker here could translate the same chapter twice and race on job state.
