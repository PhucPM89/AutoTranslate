name: Restore Tomato Cache and Migrate to Drive

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TOMATO_DATA_DIR: ${{ github.workspace }}/.crawler-data
      STORAGE_DRIVER: drive
      GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
      GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
      GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
      GOOGLE_DRIVE_STORAGE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_STORAGE_FOLDER_ID || '1-TvHLKA7z_hyt90BdJpRBsjmCQGW3z8P' }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Restore 5.14 GB Tomato Cache
        uses: actions/cache/restore@v4
        with:
          path: .crawler-data
          key: tomato-data-35216180426
          restore-keys: |
            tomato-data-

      - name: Inspect restored files
        run: |
          echo "=== DANH SÁCH FILE SAU KHI RESTORE CACHE ==="
          find .crawler-data -type f -name "*.epub" -exec ls -lh {} + || true

      - name: Run Drive Ingest Pipeline
        run: node scripts/sync-cached-epubs-to-drive.js
