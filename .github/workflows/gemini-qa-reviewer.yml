name: Gemini Semantic QA

on:
  schedule:
    - cron: "0 */6 * * *" # Controlled pilot; raise throughput only after measuring tokens/cost.
  workflow_dispatch:
    inputs:
      book:
        description: "Chỉ hậu kiểm một bookId (để trống = quét toàn bộ thư viện)"
        required: false
      force:
        description: "Tùy chọn cũ, được giữ để tương thích"
        required: false
        default: "false"
      max_chapters:
        description: "Số chương semantic review tối đa trong lượt này"
        required: false
        default: "20"

permissions:
  contents: read

jobs:
  qa_review:
    name: Source-vs-draft Semantic Reviewer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: novel-pipeline-storage-writes
      cancel-in-progress: false
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-3.6-flash' }}
      GEMINI_FALLBACK_MODELS: ${{ secrets.GEMINI_FALLBACK_MODELS || 'gemini-3.6-flash' }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ARCHIVE_BUCKET: ${{ secrets.R2_ARCHIVE_BUCKET }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      QA_BOOK_INPUT: ${{ inputs.book || '' }}
      QA_FORCE_INPUT: ${{ inputs.force || 'false' }}
      QA_MAX_CHAPTERS_INPUT: ${{ inputs.max_chapters || '20' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Run Gemini Post-Review QA
        run: |
          ARGS=(--max-chapters "$QA_MAX_CHAPTERS_INPUT")
          if [ -n "$QA_BOOK_INPUT" ]; then
            ARGS+=(--book "$QA_BOOK_INPUT")
          fi
          node scripts/gemini-qa-reviewer.js "${ARGS[@]}"
