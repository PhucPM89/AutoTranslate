name: Translation worker

# Dedicated sequential novel translation worker.
# Focuses 100% capacity on completing one novel at a time before advancing.
# Automated cloud translation disabled: automatic translation is handled exclusively by local Gemini Web.
# API keys are reserved for manual editing via Admin Dashboard / EPUB Studio.
on:
  # schedule:
  #   - cron: "*/30 * * * *"
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - "server/**"
  #     - "scripts/**"
  #     - ".github/workflows/translate-worker.yml"
  workflow_dispatch:
    inputs:
      book:
        description: "Chỉ dịch một bookId (để trống = dịch dứt điểm bộ ưu tiên)"
        required: false
      budget:
        description: "Số lượt gọi AI tối đa lượt này"
        required: false
        default: "10000"
      replace_current:
        description: "Hủy lượt đang chạy để áp dụng ngay lựa chọn ưu tiên mới"
        required: false
        default: "false"

permissions:
  contents: read
  actions: write

jobs:
  translate:
    name: Focused Sequential Novel Translator
    runs-on: ubuntu-latest
    timeout-minutes: 130
    concurrency:
      group: novel-pipeline-storage-writes
      # Scheduled/crawler runs wait normally. Only an explicit focus change from
      # the admin dashboard may replace the run that read an older configuration.
      cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' && inputs.replace_current == 'true' }}
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-3.6-flash' }}
      GEMINI_FALLBACK_MODELS: ${{ secrets.GEMINI_FALLBACK_MODELS || 'gemini-flash-latest' }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
      GROQ_MODEL: "qwen/qwen3.8-27b"
      GROQ_FALLBACK_MODELS: ""
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ARCHIVE_BUCKET: ${{ secrets.R2_ARCHIVE_BUCKET }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GEMINI_CHUNK_SIZE: "1800"
      GEMINI_TRANSLATE_CONCURRENCY: "1"
      TRANSLATE_MAX_KEYS_PER_CHUNK: "3"
      TRANSLATE_MINUTE_QUOTA_RECOVERY_MS: "15000"
      TRANSLATE_SPACING_MS: ${{ vars.TRANSLATE_SPACING_MS || '500' }}
      TRANSLATE_BOOK_INPUT: ${{ inputs.book || '' }}
      TRANSLATE_BUDGET_INPUT: ${{ inputs.budget || '10000' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Check required secrets are present
        run: node scripts/check-env.js translate

      - name: Translate Focused Book 100%
        # workflow_dispatch values are untrusted strings. Passing them through
        # quoted environment variables keeps shell metacharacters as data.
        run: |
          node scripts/translate-worker.js \
            --minutes 115 \
            --budget "$TRANSLATE_BUDGET_INPUT" \
            --batch-size 1 \
            --book "$TRANSLATE_BOOK_INPUT"

      - name: Auto-relay next translation session
        if: always() && !cancelled()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Triggering next relay session to eliminate idle gap..."
          gh workflow run "Translation worker" --repo "${{ github.repository }}" --ref main || echo "Relay dispatch skipped."
