name: Translation worker

# Dedicated sequential novel translation worker.
# Focuses 100% capacity on completing one novel at a time before advancing.
on:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches:
      - main
    paths:
      - "server/**"
      - "scripts/**"
      - ".github/workflows/translate-worker.yml"
  workflow_dispatch:
    inputs:
      book:
        description: "Chỉ dịch một bookId (để trống = dịch dứt điểm bộ ưu tiên)"
        required: false
      budget:
        description: "Số lượt gọi AI tối đa lượt này"
        required: false
        default: "5000"
      replace_current:
        description: "Hủy lượt đang chạy để áp dụng ngay lựa chọn ưu tiên mới"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  translate:
    name: Focused Sequential Novel Translator
    runs-on: ubuntu-latest
    timeout-minutes: 18
    concurrency:
      group: novel-pipeline-storage-writes
      # Scheduled/crawler runs wait normally. Only an explicit focus change from
      # the admin dashboard may replace the run that read an older configuration.
      cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' && inputs.replace_current == 'true' }}
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-2.5-flash' }}
      GEMINI_FALLBACK_MODELS: ${{ secrets.GEMINI_FALLBACK_MODELS || 'gemini-flash-latest,gemini-2.5-pro' }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
      # Translation is a direct generation task. GPT-OSS-120B and Qwen thinking
      # mode burn most of the free TPD on hidden reasoning before producing text.
      GROQ_MODEL: "qwen/qwen3.6-27b"
      GROQ_FALLBACK_MODELS: "qwen/qwen3.6-27b"
      CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      CLOUDFLARE_AI_MODEL: ${{ secrets.CLOUDFLARE_AI_MODEL || '@cf/meta/llama-3.1-8b-instruct' }}
      CLOUDFLARE_AI_FALLBACK_MODELS: ${{ secrets.CLOUDFLARE_AI_FALLBACK_MODELS || '@cf/meta/llama-3.1-70b-instruct,@cf/deepseek-ai/deepseek-r1-distill-qwen-32b' }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ARCHIVE_BUCKET: ${{ secrets.R2_ARCHIVE_BUCKET }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # 1,800 Chinese characters frequently expand beyond Groq's 4,096 output
      # tokens. Smaller chunks avoid publishing truncated translations.
      GEMINI_CHUNK_SIZE: "800"
      TRANSLATE_ALLOW_CLOUDFLARE: "false"
      TRANSLATE_SPACING_MS: ${{ vars.TRANSLATE_SPACING_MS || '500' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Check required secrets are present
        run: node scripts/check-env.js translate

      - name: Translate Focused Book 100%
        run: >
          node scripts/translate-worker.js
          --minutes 14
          --budget ${{ github.event.inputs.budget || '5000' }}
          --batch-size 4
          ${{ github.event.inputs.book && format('--book {0}', github.event.inputs.book) || '' }}
