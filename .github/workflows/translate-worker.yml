name: Translation worker

# Deliberately separate from the crawler. The crawler detects and enqueues every
# 10-15 minutes; this drains the Gemini queue in parallel with 5 sharded workers.
# Each worker processes a distinct shard of novels simultaneously (150-250 ch/min).
on:
  schedule:
    - cron: "5,35 * * * *"
  workflow_dispatch:
    inputs:
      book:
        description: "Chỉ dịch một bookId (để trống = tất cả)"
        required: false
      budget:
        description: "Số lượt gọi Gemini tối đa cho mỗi worker lượt này"
        required: false
        default: "5000"

permissions:
  contents: read

jobs:
  translate:
    name: Worker Shard ${{ matrix.shard + 1 }}/5
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      matrix:
        shard: [0, 1, 2, 3, 4]
      fail-fast: false
    concurrency:
      group: translate-worker-${{ matrix.shard }}
      cancel-in-progress: false
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
      GEMINI_CHUNK_SIZE: ${{ secrets.GEMINI_CHUNK_SIZE }}
      GEMINI_FALLBACK_MODELS: ${{ secrets.GEMINI_FALLBACK_MODELS }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ARCHIVE_BUCKET: ${{ secrets.R2_ARCHIVE_BUCKET }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TRANSLATE_SPACING_MS: ${{ vars.TRANSLATE_SPACING_MS || '200' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Check required secrets are present
        run: node scripts/check-env.js translate

      - name: Drain the translation queue (Shard ${{ matrix.shard + 1 }}/5)
        run: >
          node scripts/translate-worker.js
          --minutes 300
          --budget ${{ github.event.inputs.budget || '5000' }}
          --shard-index ${{ matrix.shard }}
          --total-shards 5
          --batch-size 3
          ${{ github.event.inputs.book && format('--book {0}', github.event.inputs.book) || '' }}
