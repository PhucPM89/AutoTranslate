name: Fanqie crawler

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fanqie-crawler.yml"
      - "scripts/crawler-worker.js"
      - "server/crawler-store.js"
      - "api/crawler/**"
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

concurrency:
  group: fanqie-crawler
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      SITE_URL: https://auto-translate-xi.vercel.app
      TOMATO_PASSWORD: tomato-local-worker
      TOMATO_DATA_DIR: ${{ github.workspace }}/.crawler-data
      # The crawler now writes chapters to R2 and metadata to Supabase through
      # runIngest(), so it needs the same credentials as the translation worker.
      # Without these the ingest step fails at the first storage write.
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ARCHIVE_BUCKET: ${{ secrets.R2_ARCHIVE_BUCKET }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Only used to translate book title/author/description, which is a handful
      # of calls. Chapter translation is the separate worker's job.
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
      GEMINI_FALLBACK_MODELS: ${{ secrets.GEMINI_FALLBACK_MODELS }}
    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install worker dependencies
        run: npm ci --ignore-scripts

      # actions/cache only saves on success, so a run that died mid-download threw
      # away every chapter it had fetched. Restore and save are split so the
      # partial state survives a failed or timed-out run and the next one resumes.
      - name: Restore Tomato state
        uses: actions/cache/restore@v4
        with:
          path: .crawler-data
          key: tomato-data-${{ github.run_id }}
          restore-keys: |
            tomato-data-

      - name: Start Tomato downloader
        run: |
          mkdir -p .crawler-data/library
          docker run -d --name tomato-crawler \
            -p 18423:18423 \
            -v "${{ github.workspace }}/.crawler-data:/data" \
            -e TOMATO_WEB_ADDR=0.0.0.0:18423 \
            -e TOMATO_WEB_PASSWORD="$TOMATO_PASSWORD" \
            -e TOMATO_DATA_DIR=/data \
            zhongbai233/tomato-novel-downloader-webui:latest

      - name: Check required secrets are present
        run: node scripts/check-env.js crawler

      - name: Discover and publish novels
        run: node scripts/crawler-worker.js

      - name: Show Tomato logs on failure
        if: failure()
        run: docker logs --tail 300 tomato-crawler || true

      - name: Make state cache readable
        if: always()
        run: sudo chown -R "$USER:$USER" .crawler-data || true

      - name: Save Tomato state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .crawler-data
          key: tomato-data-${{ github.run_id }}
