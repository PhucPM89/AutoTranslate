name: Fanqie crawler

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fanqie-crawler.yml"
      - "scripts/crawler-worker.js"
      - "server/crawler-store.js"
      - "api/crawler/**"
  schedule:
    # Every ten minutes rather than every fifteen. GitHub treats cron as best
    # effort and drops or delays firings under load - the observed runs came at
    # 12:16, 13:15, 14:03, 14:49, 15:01, 15:20 and 15:54, which matches no
    # schedule at all - so more chances means fewer long gaps. The concurrency
    # group below makes an extra firing wait rather than overlap, and a run now
    # keeps working for hours, so this is a safety net rather than the mechanism.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
    inputs:
      target_book_id:
        description: "Fanqie Book ID cụ thể cần cào lại/bổ sung (ví dụ: 6497813734990285837)"
        required: false
        default: ""

concurrency:
  group: novel-pipeline-storage-writes
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  actions: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      TOMATO_PASSWORD: tomato-local-worker
      TOMATO_DATA_DIR: ${{ github.workspace }}/.crawler-data
      # The crawler writes chapters to R2 and metadata to Supabase through
      # runIngest(), and reads its own config and status from R2. It makes no
      # request to any website, so there is no site URL or token here.
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ARCHIVE_BUCKET: ${{ secrets.R2_ARCHIVE_BUCKET }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Only translates title, author and description, a handful of calls.
      # Chapter bodies are the translation worker's job.
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
      GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
      GROQ_FALLBACK_MODELS: ${{ secrets.GROQ_FALLBACK_MODELS }}
      TARGET_BOOK_ID: ${{ github.event.inputs.target_book_id || '' }}
    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install worker dependencies
        run: npm ci --ignore-scripts

      # actions/cache only saves on success, so a run that died mid-download threw
      # away every chapter it had fetched. Restore and save are split so the
      # partial state survives a failed or timed-out run and the next one resumes.
      - name: Restore Tomato state
        uses: actions/cache/restore@v4
        with:
          path: .crawler-data
          key: tomato-data-${{ github.run_id }}
          restore-keys: |
            tomato-data-

      - name: Start Tomato downloader
        run: |
          mkdir -p .crawler-data/library
          docker run -d --name tomato-crawler \
            -p 18423:18423 \
            -v "${{ github.workspace }}/.crawler-data:/data" \
            -e TOMATO_WEB_ADDR=0.0.0.0:18423 \
            -e TOMATO_WEB_PASSWORD="$TOMATO_PASSWORD" \
            -e TOMATO_DATA_DIR=/data \
            zhongbai233/tomato-novel-downloader-webui:latest

      - name: Check required secrets are present
        run: node scripts/check-env.js crawler

      - name: Discover and publish novels
        run: node scripts/crawler-worker.js

      - name: Show Tomato logs on failure
        if: failure()
        run: docker logs --tail 300 tomato-crawler || true

      - name: Make state cache readable
        if: always()
        run: sudo chown -R "$USER:$USER" .crawler-data || true

      - name: Save Tomato state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .crawler-data
          key: tomato-data-${{ github.run_id }}

      - name: Trigger Translation Worker immediately
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'translate-worker.yml',
                ref: 'main',
                inputs: {
                  budget: '5000'
                }
              });
              console.log('✓ Successfully triggered Translation Worker cluster');
            } catch (err) {
              console.log('Workflow dispatch notice:', err.message);
            }
