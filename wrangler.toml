# Cloudflare configuration.
#
# The live deployment is Cloudflare PAGES, project "tram-chu-web": Pages serves
# public/ and routes functions/api/admin/[[path]].js, which wraps the same router
# in worker/api.js that the Workers entry below uses. Pages was chosen because the
# available API token carries Cloudflare Pages: Edit but not Workers Scripts: Edit,
# so a Pages project can be created, configured and deployed end to end without a
# manual step.
#
# This file configures the Workers alternative (`wrangler deploy`), which is kept
# working so the target can be switched without a rewrite. Pages ignores it -
# variables and bindings for Pages live on the project, set by
# `npm run configure:cf`.
#
# `npm run build` writes the static site into public/. The Worker in
# worker/index.js serves those files through the ASSETS binding and handles the
# admin routes, which are the only dynamic ones. Readers never reach the Worker:
# the catalogue and every chapter are static objects on R2 served by the CDN.
#
# nodejs_compat is required, not incidental: the admin login verifies its password
# with scrypt, and workerd's scrypt produces byte-identical output to Node's, so
# the existing password hash stays valid and the login code is shared rather than
# reimplemented.

name = "tram-chu"
main = "worker/index.js"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
# The reader is a single-page app: a deep link is served the app shell instead of
# a 404.
not_found_handling = "single-page-application"

[build]
command = "npm run build"

# Bindings, so the Worker reads and writes R2 without signing anything. Presigning
# still needs the S3 credentials below, because a binding cannot produce a
# presigned URL and a 200 MB EPUB must not pass through the Worker.
[[r2_buckets]]
binding = "NOVEL_STORAGE"
bucket_name = "novel-storage"

[[r2_buckets]]
binding = "NOVEL_ARCHIVE"
bucket_name = "novel-archive"

# Values are NOT set here - this file is committed to a public repository.
#
# Plain variables (Settings > Variables and Secrets):
#   R2_BUCKET            = novel-storage
#   R2_ARCHIVE_BUCKET    = novel-archive
#   R2_PUBLIC_BASE_URL   = https://cdn.tram-chu.online
#   GITHUB_REPOSITORY    = PhucPM89/AutoTranslate
#
# Secrets:
#   R2_ACCOUNT_ID              signing upload URLs
#   R2_ACCESS_KEY_ID           signing upload URLs
#   R2_SECRET_ACCESS_KEY       signing upload URLs
#   LIBRARY_SESSION_SECRET     signs the admin session cookie; generate a fresh
#                              random value for this deployment
#   LIBRARY_UPLOAD_PASSWORD_HASH  scrypt hash from `npm run setup:admin`
#   GITHUB_DISPATCH_TOKEN      fine-grained PAT, Actions: read and write, this
#                              repository only
#   EPUB_STUDIO_API_KEYS       server-only pool used exclusively by the
#                              authenticated VIP EPUB Studio
#   SUPABASE_URL               also needed at build time
#   SUPABASE_ANON_KEY          also needed at build time; publishable by design
#   SUPABASE_SERVICE_ROLE_KEY  only if the admin panel must write book metadata
#
# Build-time variables (inlined into the browser bundle, so they must exist during
# the build as well): R2_PUBLIC_BASE_URL, SUPABASE_URL, SUPABASE_ANON_KEY.
#
# READER_CDN_ENABLED is deliberately left unset. Setting it switches real readers
# onto the CDN and must wait until that path has been validated by hand.
